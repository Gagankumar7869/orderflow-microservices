server.port=8081
spring.application.name=identity-service

# Active profile for local development (enables AdminBootstrapRunner)
spring.profiles.active=dev

# MySQL Database Connection (Isolated schema for Identity Service)
spring.datasource.url=jdbc:mysql://localhost:3306/orderflow_identity_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD:root}

# JPA & Hibernate Configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Flyway Migration Configuration
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# Dev Admin Bootstrap Credentials (Change via Env Vars in Production)
app.bootstrap.admin-email=${APP_ADMIN_EMAIL:admin@orderflow.com}
app.bootstrap.admin-password=${APP_ADMIN_PASSWORD:Admin@12345}
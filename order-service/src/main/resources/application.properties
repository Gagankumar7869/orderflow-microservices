server.port=8083

spring.application.name=order-service

spring.datasource.url=jdbc:mysql://localhost:3306/orderflow_order_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

catalog.service.url=${CATALOG_SERVICE_URL:http://localhost:8082}
catalog.service.connect-timeout-ms=2000
catalog.service.read-timeout-ms=5000

security.jwt.issuer=${JWT_ISSUER:orderflow-identity}
security.jwt.audience=${JWT_AUDIENCE:orderflow-services}
security.jwt.secret=${JWT_SECRET:}

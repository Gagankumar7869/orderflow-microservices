spring.application.name=catalog-service
server.port=8082

# Dedicated MySQL Schema for Catalog Service
spring.datasource.url=jdbc:mysql://localhost:3306/orderflow_catalog_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD:root}

# JPA & Hibernate (Strictly validate against Flyway schema)
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Flyway Configuration
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.locations=classpath:db/migration

# Shared JWT Secret (Must match identity-service so catalog-service can verify tokens)
app.jwt.secret=${JWT_SECRET:b3JkZXJmbG93LWlkZW50aXR5LXNlcnZpY2Utc3VwZXItc2VjcmV0LWtleS0yMDI2LWdhZ2Fu}